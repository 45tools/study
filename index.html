<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Study">
<meta name="description" content="伊先生Labの動画と同じ単語・例文で、1日1分の英語学習ゲーム。中学英語・高校入試対策。登録不要・広告なし・無料。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<title>45 Study｜1日1分の英語学習ゲーム（中学英語・高校入試）</title>
<style>
:root{
  --bg:#FFF6EE; --dot:#FBE6D4; --panel:#FFFFFF; --ink:#2A2233; --muted:#6F6680; --line:#F0DDCC; --soft:#FFF1E6;
  --strong:#2A2233; --strong-ink:#FFFFFF; --danger:#E5484D; --star:#FFB21E; --ok:#1DA563;
  --c-quiz:#F26B1D; --c-listen:#2F6FEB; --c-memo:#9B5CF6; --c-inf:#E5484D; --c-math:#12A594;
  --h0:#E9E2EE; --h1:#F2857A; --h2:#FFB45C; --h3:#F2D24B; --h4:#4CC27F;
  --accent:#F26B1D; --accent-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17141D; --dot:#221D2B; --panel:#211C29; --ink:#F2EEF7; --muted:#A99FB8; --line:#3A3246; --soft:#2B2434; --strong:#F2EEF7; --strong-ink:#17141D;
    --danger:#FF6B6F; --star:#FFC23D; --ok:#3CCB84; --c-quiz:#FF8A45; --c-listen:#6E9BFF; --c-memo:#B38BFF; --c-inf:#FF6B6F; --c-math:#2CC4AE;
    --h0:#332B3E; --h1:#C9574F; --h2:#D98A35; --h3:#C9AA2E; --h4:#2FA466; --accent:#FF8A45; color-scheme:dark; }
}
body[data-g="listen"]{--accent:var(--c-listen)} body[data-g="memo"]{--accent:var(--c-memo)} body[data-g="inf"]{--accent:var(--c-inf)} body[data-g="math"]{--accent:var(--c-math)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg);height:100%;overflow:hidden}
html,body{margin:0}
body{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 4px) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","PingFang TC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
button,select,label{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
.num{font-family:"Fredoka","M PLUS Rounded 1c",system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:6px;padding:6px 10px;max-width:720px;width:100%;margin:0 auto;flex:none}
.bar .sp{flex:1;min-width:4px}
.bar .ttl{font-size:17px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:"Fredoka",sans-serif;font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand i{width:30px;height:30px;border-radius:9px;background:#F26B1D;color:#fff;font-style:normal;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:44px;padding:0 14px;font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
.btn.icon{width:44px;padding:0}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.big{min-height:52px;font-size:17px;padding:0 24px}
.btn.line{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.wrap{flex:1;min-height:0;max-width:720px;width:100%;margin:0 auto;position:relative}
[data-pane]{display:none;height:100%}
[data-pane].act{display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px calc(16px + env(safe-area-inset-bottom))}

/* ホーム */
.home{padding:0 14px calc(10px + env(safe-area-inset-bottom));gap:10px;overflow-y:auto}
.hrow{display:flex;gap:8px}
.hrow>*{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.today{border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.trow:first-of-type{border-top:0}
.trow .tl{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.3}
.trow .tl small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.trow .btn{min-height:38px;padding:0 12px;font-size:13px}
.trow .done{color:var(--ok)}
.stat{text-align:center;padding:8px 4px}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.stat b{font-size:24px;line-height:1.1}
.stat b small{font-size:12px;margin-left:2px}
.more h3,.today h3{margin-top:0}
.more #moreList:not(:empty){margin-bottom:10px}
.more .hbtns{margin-top:10px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.game .gi{--c:var(--c-quiz);width:100%;max-width:74px;aspect-ratio:1;border-radius:23%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 60%,#fff) 0%,var(--c) 70%);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 62%,#000);color:#fff}
.game .gi .ic{width:56%;height:56%}
.game:active .gi{transform:translateY(3px)}
.game b{font-size:12.5px;font-weight:800;text-align:center;line-height:1.25}
.hbtns{display:flex;gap:8px}
.hbtns .btn{flex:1;min-height:48px}
.cdn{font-size:12px;color:var(--muted);text-align:center}

/* 単元一覧 */
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin:0 12px 8px;flex:none}
.seg button{flex:1;border:0;background:transparent;min-height:40px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.grp{font-size:12px;font-weight:800;color:var(--muted);margin:12px 4px 4px;display:flex;align-items:center;gap:8px}
.grp:first-child{margin-top:2px}
.unit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:9px 10px;margin-top:6px;color:var(--ink)}
.unit .hm{width:12px;align-self:stretch;border-radius:6px;background:var(--h0);flex:none}
.unit .un{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.3}
.unit .un small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.unit .ur{text-align:right;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;line-height:1.5}
.unit .ur b{font-size:16px;color:var(--ink)}
.h1{background:var(--h1)!important} .h2{background:var(--h2)!important} .h3{background:var(--h3)!important} .h4{background:var(--h4)!important}
.prog h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:15px}
.prog h3 .ic{width:18px;height:18px}
.prog h3 small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.pgr{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
.pgn{flex:0 0 38%;font-size:12px;line-height:14px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgt{flex:1;display:flex;flex-wrap:wrap;gap:3px}
.pt{width:14px;height:14px;border:0;border-radius:4px;padding:0;background:var(--h0);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin:10px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px;background:var(--h0)}
.series{margin-top:8px}
.series h4{margin:12px 2px 6px;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;font-size:16px;padding:0;position:relative;color:var(--ink)}
.pbtn.st{background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-color:var(--accent)}
.pbtn.st::after{content:"★";position:absolute;right:2px;top:-2px;font-size:11px;color:var(--star)}
.pbtn.now{box-shadow:0 0 0 2px var(--c-listen)}
.uhead{padding:0 4px 4px}
.uhead h2{margin:0;font-size:20px}
.uhead p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.ubtns{display:flex;gap:8px;margin:10px 0 4px}
.ubtns .btn{flex:1}
.urec{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 0;flex-wrap:wrap}
.urec b{font-size:15px;color:var(--ink)}

/* 問題 */
.qhead{display:flex;align-items:center;gap:8px;padding:2px 12px 4px;flex:none}
.qhead .prog{font-size:20px}
.qhead .sp{flex:1}
.qhead .stk{font-size:22px;color:var(--c-inf)}
.ghost{display:flex;flex-direction:column;gap:3px;padding:0 12px 4px;flex:none}
.ghost div{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);font-weight:700}
.ghost div span{width:34px}
.ghost i{width:14px;height:8px;border-radius:3px;background:var(--h0)}
.ghost i.o{background:var(--ok)} .ghost i.x{background:var(--danger)}
.tbar{height:6px;margin:0 12px;border-radius:3px;background:var(--soft);overflow:hidden;flex:none}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:3px;transform-origin:left}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 0;overflow-y:auto}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:center;position:relative}
.qcard .qk{font-size:12px;color:var(--muted);font-weight:700}
.qcard .qw{font-size:clamp(28px,9vw,40px);font-weight:800;margin:6px 0;line-height:1.25;word-break:break-word}
.qcard .qs{font-size:clamp(18px,5.2vw,22px);font-weight:700;line-height:1.6;margin:6px 0;text-align:left}
.qcard .qj{font-size:14px;color:var(--muted);line-height:1.6;text-align:left}
.qcard .qj.big{font-size:17px;color:var(--ink);font-weight:700}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--accent);margin:0 2px}
.fill{color:var(--accent);font-weight:800;border-bottom:3px solid var(--accent)}
.replay{position:absolute;right:8px;top:8px;width:40px;min-height:40px}
.chs{display:grid;gap:8px;margin-top:10px}
.chs.v{grid-template-columns:repeat(2,minmax(0,1fr))}
.ch{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;min-height:54px;padding:8px 10px;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;box-shadow:0 3px 0 var(--line)}
.ch:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ch.right{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.ch.wrong{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:none}
.ch.dim{opacity:.45}
.fb{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.65;background:var(--soft)}
.fb .h{font-weight:800;font-size:15px}
.fb .h.ok{color:var(--ok)} .fb .h.ng{color:var(--danger)}
.fb .why{margin-top:4px}
.fb .ex{margin-top:6px;color:var(--muted);font-size:13px}
.fb .src{margin-top:6px;font-size:12px;color:var(--muted)}
.mv{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-weight:600;font-size:1.12em;padding:0 .03em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.88em;line-height:1.15}
.fr>span:last-child .rt>span{margin-top:3px;display:inline-block;line-height:1.1}.rt{white-space:nowrap}.rt>span{border-top:1.5px solid currentColor;padding:0 .12em;margin-left:.05em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.qm{font-size:clamp(24px,7.4vw,32px);font-weight:800;margin:10px 0 4px;line-height:1.5;font-family:"Fredoka","M PLUS Rounded 1c",sans-serif}
.qm.st{font-size:clamp(20px,6vw,26px)}
.chs.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
.chs.tf .ch{min-height:84px;font-size:40px;font-family:"Fredoka",sans-serif}
.ch.m{font-family:"Fredoka","M PLUS Rounded 1c",sans-serif;font-size:20px}
.ch.m.lg{font-size:16px;font-family:"M PLUS Rounded 1c",sans-serif;text-align:left;padding:10px 14px}
.qm.wd{font-size:clamp(17px,4.8vw,21px);font-family:"M PLUS Rounded 1c",sans-serif}
.qm svg.fig{display:block;max-width:100%;height:auto;max-height:42vh;margin:8px auto 2px}
.fig .g{stroke:var(--line);stroke-width:1}.fig .ax{stroke:var(--ink);stroke-width:1.6}.fig .dl{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.fig .ln{stroke:var(--accent);stroke-width:2.6;fill:none}.fig .pt{fill:var(--accent)}.fig .f1{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:2}
.fig .f2{fill:color-mix(in srgb,var(--ink) 12%,transparent);stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.fig text{fill:var(--ink);font-family:"Fredoka","M PLUS Rounded 1c",sans-serif}.fig .lb{font-size:14px;font-weight:700}.fig .nm{font-size:11px}
.qm table.mt{border-collapse:collapse;margin:8px auto 2px;font-size:15px;font-weight:600}.mt th,.mt td{border:1px solid var(--line);padding:3px 9px;text-align:center}.mt th{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.chs.one{grid-template-columns:1fr}
.tlrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.tlrow label{flex:1 1 150px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.tlrow label .ic{width:16px;height:16px;flex:none}
.tlrow select{margin-left:auto;min-width:0;max-width:62%;font:inherit;font-weight:800;color:var(--ink);background:transparent;border:0;text-align:right}
.qm .sys{display:inline-flex;flex-direction:column;align-items:flex-start;border-left:2.5px solid var(--ink);border-radius:12px 0 0 12px;padding:2px 0 2px 12px;margin:6px 0;font-family:"Fredoka","M PLUS Rounded 1c",sans-serif;font-size:clamp(19px,5.6vw,24px);line-height:1.55}
.qm .dl2{display:block;margin-top:6px;font-family:"Fredoka",sans-serif;font-size:clamp(18px,5.4vw,22px);letter-spacing:.02em}
.fig .ln2{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-dasharray:7 4}
.fb .ans{margin-top:4px;font-weight:800;font-family:"Fredoka","M PLUS Rounded 1c",sans-serif}
.subj{margin:0 0 2px}
.mode{display:flex;gap:6px;margin:8px 0 2px}
.mode button{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;min-height:38px;font-weight:700;color:var(--ink)}
.mode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dock{flex:none;display:flex;justify-content:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.dock .btn{flex:1;max-width:420px}

/* 反対語めくり */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px auto 0;width:100%;max-width:440px}
.mc{border:0;border-radius:14px;min-height:84px;padding:6px;font-size:18px;font-weight:800;line-height:1.2;color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c-memo) 40%,transparent),0 3px 0 color-mix(in srgb,var(--c-memo) 30%,transparent);word-break:break-word;font-family:"Fredoka","M PLUS Rounded 1c",sans-serif}
.mc span{display:block}
.mc.up{background:var(--c-memo);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c-memo) 60%,#000)}
.mc.got{box-shadow:inset 0 0 0 2px var(--ok);opacity:.9}
.mc small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;font-family:"M PLUS Rounded 1c",sans-serif}
.mc small:empty{display:none}
.mc.bad{box-shadow:inset 0 0 0 3px var(--danger)}
.mmsg{text-align:center;font-size:14px;font-weight:700;min-height:24px;margin-top:8px;color:var(--muted)}

/* シート */
.overlay{position:fixed;inset:0;background:rgba(20,10,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px;font-size:18px}
.resbig{text-align:center;margin:4px 0 10px}
.resbig b{font-size:60px;line-height:1;display:block}
.resbig span{font-size:13px;color:var(--muted)}
.resbig .nb{display:inline-block;margin-top:6px;background:var(--star);color:#2A2233;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.marks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:6px 0}
.marks i{width:16px;height:16px;border-radius:4px;background:var(--ok)}
.marks i.x{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats>div{text-align:center;padding:8px 4px}
.stats>div + div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:22px;line-height:1.1}
.stats span{font-size:11px;color:var(--muted)}
.mlist{margin:10px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.5}
.mlist li{padding:6px 0;border-top:1px solid var(--line)}
.mlist small{color:var(--muted)}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.help{line-height:1.75;font-size:14px}
.help b{color:var(--accent)}
.help h3{font-size:15px;margin:14px 0 2px}
.help a{color:var(--c-listen)}
.menu{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 56px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(30,10,30,.25);padding:6px;display:flex;flex-direction:column;min-width:270px;max-height:calc(100vh - 80px);overflow:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}

  how:"<p>YouTube「伊先生Lab」の英語ショートと<b>同じ番号・同じ文</b>で遊べる、1日1分の学習ゲームです。登録はいらず、記録はこの端末の中だけに保存されます。</p><h3>⚡ 2秒クイズ</h3>単語を見て、2秒で意味を選びます。動画と同じテンポで「すぐ思い出せる」まで練習できます。前回の自分の結果（○×）が上に出るので、前回の自分と勝負しよう。<h3>🎧 聞いて埋める</h3>英文を聞いて（　）に入る語句を選びます。まちがえると、えらんだ答えがなぜちがうのかが出ます。<h3>🃏 反対語めくり</h3>big ⇔ small のような反対の意味の2枚をそろえる神経衰弱です。<h3>∞ 無限モード・入試ミックス</h3>まちがえるまで続きます。入試ミックスは、遊んだことのある単元をまぜて出します（入試ではどの文法を使うか自分で見分ける力が必要です）。<h3>今日の1分・1周プラン・復習</h3>ホームには、その日に動画で公開された回、入試日から逆算した「今日やる単元」、まちがえた問題の復習（1日・3日・1週間後）が出ます。<h3>苦手マップ・スタンプ</h3>「単元で選ぶ」の色は正答率です。8割以上とれたPartにはスタンプ（★）がつきます。<h3>日本語→英語</h3>メニューで切り替えると、日本語を見て英語を選ぶ問題になります。<h3>記録のバックアップ</h3>記録はこの端末の中だけにあります。メニューの「記録のバックアップ」で、コードやファイルに保存して、機種変更のときにもどせます。",
  src:"<p><b>単元の並びと名前</b>：文部科学省「中学校学習指導要領（平成29年告示）解説 外国語編」第2章第2節「英語」2 内容 の項目に合わせています。学習指導要領は文法事項を3学年まとめて示しているため、「学年の目安」は一般的な学習の順をもとにしたものです。</p><p><b>問題文</b>：伊先生Labのオリジナルです（教科書の文章は使っていません）。名言・ことわざは出典を表示しています。</p><p><b>音声</b>：Microsoft Edge の読み上げ音声で作った、動画と同じ音声です。</p><p><b>数学</b>：単元の並びは「中学校学習指導要領（平成29年告示）」数学 第1学年・第2学年（それぞれ A 数と式・B 図形・C 関数・D データの活用）に合わせています。問題はアプリがその場で作るオリジナルです。</p><p><a href=\"https://www.mext.go.jp/content/20210531-mxt_kyoiku01-100002608_010.pdf\" target=\"_blank\" rel=\"noopener\">学習指導要領 解説 外国語編（PDF）</a></p>",
  bkTitle:"記録のバックアップ",bkSave:"記録を保存する",bkLoad:"保存した記録をもどす",bkCopy:"コードをコピー",bkFileBtn:"ファイルに保存",bkOpen:"ファイルを開く",bkRestore:"もどす",bkInfo:"<p>記録はこの端末のブラウザの中だけにあります（サーバーには送りません）。<b>機種変更・ブラウザのデータ消去</b>で消えるので、ときどき保存しておきましょう。コードはメモやLINEの自分あてなどに貼っておけます。</p>",bkHome:"<p class=\"hint\">iPhoneのSafariは、7日間開かないと記録を消すことがあります。共有ボタン →「ホーム画面に追加」から開くと消えにくくなります。</p>",bkPersist:"この端末の「消えにくい設定」：{v}",bkLast:"前回の保存：{d}",bkNever:"まだ保存していません",bkCopied:"コードをコピーしました",bkBad:"記録のコードではないようです",bkAsk:"今の記録を、保存した記録（{d}）に置きかえます。もう一度「もどす」を押してください",bkDone:"記録をもどしました",bkRemind:"記録のバックアップ",bkRemindSub:"{n}日保存していません（機種変更などにそなえて）",bkGo:"保存",homeHint:"ホーム画面に追加すると、記録が消えにくくなります",

  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay; o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.02); }
const sfx={ok(){tone(880,.12,"sine",.16);tone(1320,.2,"sine",.13,.09)},ng(){tone(220,.25,"square",.06);tone(165,.28,"square",.05,.1)},flip(){tone(660,.05,"triangle",.07)},

  const sets=[]; for(let i=0;i<pairs.length;i+=6) sets.push(pairs.slice(i,i+6)); if(sets.length>1&&sets[sets.length-1].length<4){ const l=sets.pop(); sets[sets.length-1].push(...l); } return sets; })();

/* ===== 記録 =====
  s_it   {問題ID:[回数,正解数,復習日(日数),段階]}   s_part {単元:Part: 最高の正解率}   s_inf {範囲: 最高連続}

const REC={ it:store.get("s_it",{}), part:store.get("s_part",{}), inf:store.get("s_inf",{}), gh:store.get("s_gh",{}), day:store.get("s_day",{last:"",streak:0}), memo:store.get("s_memo",{}),

  touchDay(){ const d=today(); if(this.day.last===d) return; const y=this.day.last&&dayN(d)-dayN(this.day.last)===1; this.day={last:d,streak:y?this.day.streak+1:1}; },
  streak(){ const d=today(); if(!this.day.last) return 0; const g=dayN(d)-dayN(this.day.last); return g<=1?this.day.streak:0; },
  mark(o,ok){ const d=dayN(today()); const r=this.it[o.id]||[0,0,0,0]; r[0]++; if(ok) r[1]++;
    if(!ok){ r[2]=d+1; r[3]=0; } else if(r[2]&&r[2]<=d){ r[3]++; r[2]=r[3]>=3?0:d+[1,3,7][r[3]]; }

  stamped(u,p){ return u.k==="ant"?this.memo[p]!=null:(this.part[u.id+":"+p]||0)>=.8; },
};

    if(tf){ const w=Math.random()<.5?null:g.wrongs[rnd(g.wrongs.length)]; const v=w?w.v:g.ans; return {o,kind:"m",tf:true,g,stmt:g.tf(v),fwhy:w?w.why:"",ch:[{t:"○",ok:!w},{t:"×",ok:!!w}]}; }
    return {o,kind:"m",tf:false,g,ch:shuffle([{t:g.ans,ok:true},...g.wrongs.slice(0,3).map(w=>({t:w.v,ok:false,why:w.why}))])}; }
  if(o.k==="gram"){ const ch=shuffle(o.ch.slice()); return {o,kind:"g",rev,ch:ch.map(c=>({t:c,ok:c===o.b})),audio:o.id,text:o.en}; }
  const pool=V[o.k]; const field=rev?"w":"ja"; const used=new Set([o[field],o.w,o.ja]); const opts=[];
  for(const x of shuffle(pool.filter(z=>z.p===o.p||Math.abs(z.p-o.p)<=2))){ if(opts.length>=3) break; if(used.has(x[field])||used.has(x.w)) continue; used.add(x[field]); opts.push(x); }
  for(const x of shuffle(pool.slice())){ if(opts.length>=3) break; if(used.has(x[field])) continue; used.add(x[field]); opts.push(x); }
  const ch=shuffle([{t:o[field],ok:true,x:o},...opts.map(x=>({t:x[field],ok:false,x}))]);
  return {o,kind:"v",rev,ch,audio:o.id,text:o.w}; }

    if(q.rev) say(q.audio,q.text); }
  $("#qFb").innerHTML=`<div class="fb pop">${fb}</div>`; headQ();
  const last=Z.mode==="inf"?!ok:Z.i>=Z.items.length-1;
  $("#qDock").innerHTML=`<button class="btn primary big" id="qNext">${esc(t(last?"seeResult":"next"))}<i class="ic" data-ic="next"></i></button>`; paintIcons($("#qDock"));
  $("#qNext").onclick=()=>{ if(last) finish(); else { Z.i++; ask(); } };
  if(ok&&!last&&(q.kind==="v"||q.tf)&&Z.mode!=="inf"){ const id=Z.id,qq=q; setTimeout(()=>{ if(Z&&Z.id===id&&Z.q===qq&&pane==="quiz") { Z.i++; ask(); } },1100); }
  if(ok&&Z.mode==="inf"&&(q.kind==="v"||q.tf)){ const id=Z.id,qq=q; setTimeout(()=>{ if(Z&&Z.id===id&&Z.q===qq&&pane==="quiz") ask(); },900); }
  $("#qBody").scrollTop=$("#qBody").scrollHeight; }
function finish(){ hush(); const z=Z; Z=null; const sec=Math.round((Date.now()-z.t0)/1000);
  if(z.mode==="inf"){ const n=z.marks.filter(Boolean).length; const prev=REC.inf[z.scope]||0; const all=Math.max(0,...Object.values(REC.inf));
    if(n>prev) REC.inf[z.scope]=n; REC.save();
    showResult({title:z.title+" ∞",big:n,bigLbl:t("resStreak"),isNew:n>prev&&n>0,newLbl:t("newBest"),marks:z.marks,
      stats:[[String(z.scope).startsWith("mix")?t("best"):t("resBestU"),REC.inf[z.scope]||0],[t("resBestAll"),Math.max(all,n)],[t("resTime"),sec+"s"]],miss:z.miss,share:`∞ ${n}`,
      retry:()=>startInf({scope:z.scope,items:z.items,title:z.title})}); }
  else { const c=z.marks.filter(Boolean).length,n=z.marks.length; let stamp=false;
    if(z.gk) REC.gh[z.gk]=z.marks;
    if(z.u&&z.p!=null){ const k=z.u.id+":"+z.p; const before=REC.stamped(z.u,z.p); REC.part[k]=Math.max(REC.part[k]||0,c/n); stamp=!before&&REC.stamped(z.u,z.p);
      if(stamp){ const pl=store.get("s_plan",{}); pl[k]=today(); store.set("s_plan",pl); } }
    REC.save(); if(stamp) sfx.win();
    const ghostC=z.ghost?z.ghost.filter(Boolean).length:null;
    showResult({title:z.title,big:`${c}/${n}`,bigLbl:t("resScore"),isNew:stamp,newLbl:t("stampGet"),marks:z.marks,
      stats:[[t("resScore"),`${Math.round(c/n*100)}%`],[t("ghostPrev"),ghostC==null?"—":`${ghostC}/${z.ghost.length}`],[t("resTime"),sec+"s"]],miss:z.miss,share:`${c}/${n}`,
      retry:()=>z.review?startReview():z.p!=null?playPart(z.u,z.p):startQuiz({...z,items:z.u.k==="math"?rep10(unitItems(z.u)):shuffle(unitItems(z.u)).slice(0,10)})}); } }
function quitQuiz(){ if(Z){ clearTimeout(Z.tt); } hush(); Z=null; back(); }

/* ===== 結果 ===== */
let resRetry=null,resShare="";
function showResult(r){ $("#resTitle").textContent=r.title; $("#resBig").textContent=r.big; $("#resBigLbl").textContent=r.bigLbl;
  $("#resNew").hidden=!r.isNew; $("#resNew").textContent=r.newLbl||"";
  $("#resMarks").innerHTML=(r.marks||[]).slice(-60).map(m=>`<i class="${m?"":"x"}"></i>`).join("");
  $("#resStats").innerHTML=r.stats.map(([a,b])=>`<div><b class="num">${esc(b)}</b><span>${esc(a)}</span></div>`).join("");
  $("#resList").innerHTML=r.miss&&r.miss.length?`<li style="border:0;font-weight:800;font-size:13px;color:var(--muted)">${esc(t("mistakes"))}</li>`+r.miss.map(o=>o.k==="mq"?`<li>${o.h}<br><small>${esc(t("ansIs2"))}${o.tf?"":""}${o.ans}</small></li>`:o.k==="gram"?`<li>${sentHTML(o,true)}<br><small>${esc(o.ja)}</small></li>`:`<li><b>${esc(o.w)}</b> ＝ ${esc(o.ja)}</li>`).join(""):"";
  resRetry=r.retry; resShare=`${t("shareTxt",{u:r.title,s:r.share})}\n${(r.marks||[]).slice(-30).map(m=>m?"🟩":"🟥").join("")}\nhttps://45tools.github.io/study/`;
  $("#resOv").classList.add("on"); }
function hideResult(){ $("#resOv").classList.remove("on"); }

/* ===== 反対語めくり ===== */
let M=null;
function startMemo(n){ const set=ANT[n-1]; if(!set) return; const cards=shuffle(set.flatMap((pr,i)=>pr.map(o=>({o,pi:i}))));
  M={n,cards,up:[],got:0,moves:0,t0:Date.now(),lock:false,id:Math.random()}; document.body.dataset.g="memo"; show("memo",`${t("gMemo")} ${t("memoSet",{n})}`);
  $("#mGrid").innerHTML=cards.map((c,i)=>`<button class="mc" data-m="${i}"><span>${esc(c.o.w)}<small></small></span></button>`).join("");
  $("#mGrid").style.gridTemplateColumns=`repeat(${cards.length>12?4:3},minmax(0,1fr))`;
  $$("#mGrid [data-m]").forEach(b=>b.onclick=()=>flip(+b.dataset.m,b)); $("#mMsg").textContent=t("memoTap"); $("#mDock").innerHTML=""; memoHead();
  clearInterval(memoTick); memoTick=setInterval(()=>{ if(M&&pane==="memo") $("#mTime").textContent=Math.floor((Date.now()-M.t0)/1000)+"s"; },500); }
let memoTick=0;
function memoHead(){ $("#mProg").textContent=`${M.got}/${M.cards.length/2}`; }
async function flip(i,b){ if(!M||M.lock||b.classList.contains("got")) return; if(b.classList.contains("up")){ if(M.up.length===1&&M.up[0][0]===i){ b.classList.remove("up"); M.up=[]; } return; } const c=M.cards[i]; b.classList.add("up"); sfx.flip(); say(c.o.id,c.o.w); M.up.push([i,b]);
  if(M.up.length<2) return; M.moves++; M.lock=true; const [[i1,b1],[i2,b2]]=M.up; M.up=[]; const c1=M.cards[i1],c2=M.cards[i2]; const id=M.id;
  if(c1.pi===c2.pi){ await wait(350); if(!M||M.id!==id) return; [b1,b2].forEach((x,k)=>{ x.classList.remove("up"); x.classList.add("got"); x.querySelector("small").textContent=(k?c2:c1).o.ja; });
    M.got++; sfx.ok(); $("#mMsg").textContent=t("memoPair",{a:`${c1.o.w}（${c1.o.ja}）`,b:`${c2.o.w}（${c2.o.ja}）`}); memoHead(); M.lock=false;
    if(M.got===M.cards.length/2) memoDone(); }
  else { b1.classList.add("bad"); b2.classList.add("bad"); $("#mMsg").textContent=t("memoNo"); await wait(900); if(!M||M.id!==id) return; [b1,b2].forEach(x=>x.classList.remove("up","bad")); M.lock=false; } }
async function memoDone(){ const m=M; clearInterval(memoTick); const sec=Math.round((Date.now()-m.t0)/1000); const prev=REC.memo[m.n]; const first=prev==null;
  if(first||m.moves<prev) REC.memo[m.n]=m.moves; REC.touchDay(); const pl=store.get("s_plan",{}); if(first){ pl["ant:"+m.n]=today(); store.set("s_plan",pl); } REC.save(); sfx.win();
  await wait(700); if(M!==m) return; M=null;
  showResult({title:`${t("gMemo")} ${t("memoSet",{n:m.n})}`,big:m.moves,bigLbl:t("memoMoves"),isNew:first||m.moves<prev,newLbl:first?t("stampGet"):t("newBest"),marks:[],
    stats:[[t("best"),REC.memo[m.n]],[t("resTime"),sec+"s"],[t("memoClear"),`${m.cards.length/2}`]],miss:[],share:`${t("memoMoves")} ${m.moves}`,retry:()=>startMemo(m.n)}); }
function quitMemo(){ clearInterval(memoTick); M=null; hush(); back(); }

/* ===== メニュー・設定 ===== */
function openMenu(on){ $("#menu").hidden=!on; $("#scrim").hidden=!on; $("#menuBtn").setAttribute("aria-expanded",on?"true":"false"); }
function paintToggles(){ const tg=(el,v)=>{ el.textContent=t(v?"on":"off"); el.classList.toggle("on",v); };
  tg($("#revV"),REV()); tg($("#sndV"),store.get("s_snd",true)); $$("#menu select[data-tl]").forEach(x=>x.innerHTML=tlOpts(x.dataset.tl==="inf"));
  $("#examSel").innerHTML=EXAMS.map(([d,k])=>`<option value="${d}">${esc(t(k))}</option>`).join(""); $("#examSel").value=store.get("s_exam",EXAMS[0][0]);
  const g=lang==="ja"?GUIDE.ja:lang==="en"?GUIDE.en:GUIDE.zh; $("#guideLink").hidden=!g; if(g) $("#guideLink").href=g; }
function applyLang(){ document.documentElement.lang=lang; $$("[data-i]").forEach(el=>el.innerHTML=t(el.dataset.i)); $("#lang").value=lang; paintToggles();
  if(pane==="home") renderHome(); else if(pane==="units") renderUnits(); else if(pane==="unit"&&curUnit) renderUnit(curUnit); }
function help(title,html){ $("#helpTitle").textContent=title; $("#helpText").innerHTML=html; $("#helpOv").classList.add("on"); }
let resetArmed=0;

/* ===== 記録のバックアップ =====
  コード＝「45S1:」＋記録（s_ で始まるキー）をJSONにしてbase64。ファイルも同じ中身 */
const STANDALONE=(()=>{ try{ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }catch(e){ return false; } })();
const BK={ KEYS:["s_it","s_part","s_inf","s_gh","s_day","s_memo","s_plan","s_exam","s_rev","s_tm","s_tl","s_tli","s_snd","s_lang","s_subj","s_mm","s_bk"],
  asked:false, pers:null, armed:0, pending:null,
  persist(){ if(this.asked) return; this.asked=true; try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().then(v=>this.pers=v).catch(()=>{}); }catch(e){} },
  dump(){ const o={v:1,at:new Date().toISOString(),app:"45study",d:{}}; for(const k of this.KEYS){ const v=localStorage.getItem(k); if(v!=null&&k!=="s_bk") o.d[k]=v; } return o; },
  code(){ const j=JSON.stringify(this.dump()); return "45S1:"+btoa(unescape(encodeURIComponent(j))); },
  parse(txt){ txt=(txt||"").trim(); try{ let o; if(txt.startsWith("45S1:")) o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(5).replace(/\s+/g,""))))); else o=JSON.parse(txt);
      if(o&&o.app==="45study"&&o.d&&typeof o.d==="object") return o; }catch(e){} return null; },
  saved(){ store.set("s_bk",{at:new Date().toISOString()}); },
  remindDays(){ const n=Object.keys(REC.it).length; if(n<30) return 0; const b=store.get("s_bk",null); const last=b?Date.parse(b.at):Date.parse(REC.first||0)||0;
    const days=b?Math.floor((Date.now()-last)/864e5):14; return days>=14?days:0; },
  async open(){ openMenu(false); this.pending=null; $("#bkText").value=""; const b=store.get("s_bk",null);
    let pv=this.pers; try{ if(navigator.storage&&navigator.storage.persisted) pv=await navigator.storage.persisted(); }catch(e){}
    $("#bkInfo").innerHTML=t("bkInfo")+(STANDALONE?"":t("bkHome"))+`<p style="font-size:12px;color:var(--muted)">${esc(t("bkLast",{d:b?new Date(b.at).toLocaleString():""}).replace(/：$|: $/,"："+t("bkNever")))}<br>${esc(t("bkPersist",{v:t(pv?"on":"off")}))}</p>`;
    if(!b) $("#bkInfo p:last-child").innerHTML=`${esc(t("bkNever"))}<br>${esc(t("bkPersist",{v:t(pv?"on":"off")}))}`;
    $("#bkOv").classList.add("on"); },
  async copy(){ const c=this.code(); try{ await navigator.clipboard.writeText(c); this.saved(); toast(t("bkCopied")); }catch(e){ $("#bkText").value=c; $("#bkText").select(); } },
  file(){ const blob=new Blob([JSON.stringify(this.dump())],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`45study-${today()}.json`; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); this.saved(); },
  restore(){ const o=this.pending||this.parse($("#bkText").value); if(!o){ toast(t("bkBad")); return; }
    if(Date.now()-this.armed>4000||this.pending!==o){ this.pending=o; this.armed=Date.now(); toast(t("bkAsk",{d:new Date(o.at).toLocaleDateString()})); return; }
    for(const k of this.KEYS) if(k!=="s_bk") localStorage.removeItem(k); for(const k in o.d) if(this.KEYS.includes(k)) localStorage.setItem(k,o.d[k]);
    this.saved(); toast(t("bkDone")); setTimeout(()=>location.reload(),700); } };
$("#bkBtn").onclick=()=>BK.open(); $("#bkClose").onclick=()=>$("#bkOv").classList.remove("on");
$("#bkCopy").onclick=()=>BK.copy(); $("#bkFile").onclick=()=>BK.file(); $("#bkRestore").onclick=()=>BK.restore();
$("#bkText").oninput=()=>{ BK.pending=null; };
$("#bkIn").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const txt=await f.text(); e.target.value=""; const o=BK.parse(txt); if(!o){ toast(t("bkBad")); return; } $("#bkText").value=""; BK.pending=null; BK.pending=o; BK.armed=Date.now(); toast(t("bkAsk",{d:new Date(o.at).toLocaleDateString()})); };

/* ===== 起動 ===== */
paintIcons(); $("#supportLink").href=SUPPORT_URL; $("#chLink").href=CHANNEL_URL;
$("#menuBtn").onclick=()=>openMenu($("#menu").hidden); $("#scrim").onclick=()=>openMenu(false);
$("#backBtn").onclick=back; $("#qQuit").onclick=quitQuiz; $("#mQuit").onclick=quitMemo;
$("#helpBtn").onclick=()=>{ openMenu(false); help(t("howTitle"),t("how")); };
$("#srcBtn").onclick=()=>{ openMenu(false); help(t("srcTitle"),t("src")); };
$("#helpClose").onclick=()=>$("#helpOv").classList.remove("on");
$("#revBtn").onclick=()=>{ store.set("s_rev",!REV()); paintToggles(); };
$("#sndBtn").onclick=()=>{ store.set("s_snd",!store.get("s_snd",true)); paintToggles(); };
$("#examSel").onchange=e=>{ store.set("s_exam",e.target.value); if(pane==="home") renderHome(); };
$("#resetBtn").onclick=()=>{ if(Date.now()-resetArmed>3000){ resetArmed=Date.now(); toast(t("resetAsk")); return; }
  ["s_it","s_part","s_inf","s_gh","s_day","s_memo","s_plan"].forEach(k=>store.del(k)); location.reload(); };
$("#lang").onchange=e=>{ lang=e.target.value; store.set("s_lang",lang); applyLang(); };
$("#resClose").onclick=()=>{ hideResult(); back(); };
$("#resRetry").onclick=()=>{ hideResult(); NAV.length&&NAV[NAV.length-1][0]===pane; const f=resRetry; if(f){ const keep=NAV.slice(); f(); NAV.length=0; NAV.push(...keep.filter(x=>x[0]!=="quiz"&&x[0]!=="memo")); } };
$("#resShare").onclick=async()=>{ try{ if(navigator.share){ await navigator.share({text:resShare}); return; } }catch(e){ return; } try{ await navigator.clipboard.writeText(resShare); toast(t("copied")); }catch(e){} };
$("#toUnits").onclick=()=>openUnits(); $("#toMix").onclick=()=>startMix();
$$("#uSeg button").forEach(b=>b.onclick=()=>{ uTab=b.dataset.v; renderUnits(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&Z) clearTimeout(Z.tt); });
applyLang();
if(Date.now()<Date.parse(RELEASE)&&!PREVIEW){ $("#notyetMsg").innerHTML=t("notyet"); show("notyet","",false); $("#menuBtn").hidden=true; }
else goHome();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
